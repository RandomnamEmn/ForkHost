name: Build and release

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows
            triplet: x64-windows-static
            artifact: ForkHost-windows-x64
          - name: macOS Apple Silicon
            os: macos-latest
            platform: macos
            triplet: arm64-osx
            artifact: ForkHost-macos-arm64
            use_devbox: true
          - name: macOS Intel
            os: macos-15-intel
            platform: macos
            triplet: x64-osx
            artifact: ForkHost-macos-x64
            use_devbox: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install juce:${{ matrix.triplet }} asiosdk:${{ matrix.triplet }}

      - name: Install Devbox (macOS Apple Silicon)
        if: matrix.platform == 'macos' && matrix.use_devbox
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: 'true'
          devbox-version: '0.17.5'

      - name: Install dependencies (macOS Intel)
        if: matrix.platform == 'macos' && !matrix.use_devbox
        shell: bash
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install juce:${{ matrix.triplet }}

      - name: Configure (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cmake -S . -B build `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}"

      - name: Configure (macOS Apple Silicon)
        if: matrix.platform == 'macos' && matrix.use_devbox
        shell: bash
        run: devbox run configure

      - name: Configure (macOS Intel)
        if: matrix.platform == 'macos' && !matrix.use_devbox
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        run: cmake --build build --config Release --parallel

      - name: Build (macOS Apple Silicon)
        if: matrix.platform == 'macos' && matrix.use_devbox
        shell: bash
        run: devbox run build

      - name: Build (macOS Intel)
        if: matrix.platform == 'macos' && !matrix.use_devbox
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Package Windows build
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item "build/ForkHost_artefacts/Release/ForkHost.exe" "dist/package/"
          Copy-Item "build/ForkHostCLI_artefacts/Release/lhc.exe" "dist/package/"

          $pdbs = @(Get-ChildItem "build/ForkHostCLI_artefacts/Release" -Filter "*.pdb")
          if ($pdbs.Count -eq 0) {
            throw "ForkHostCLI PDB was not generated"
          }
          $pdbs | ForEach-Object { Copy-Item $_.FullName "dist/package/" }

          Compress-Archive `
            -Path "dist/package/*" `
            -DestinationPath "dist/${{ matrix.artifact }}.zip"

      - name: Package macOS build
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir -p dist/package
          cp -R "build/ForkHost_artefacts/Release/ForkHost.app" "dist/package/"
          cp "build/ForkHostCLI_artefacts/Release/lhc" "dist/package/"

          DSYM="build/ForkHostCLI_artefacts/Release/lhc.dSYM"
          if [ ! -d "$DSYM" ]; then
            echo "ForkHostCLI dSYM was not generated" >&2
            exit 1
          fi
          cp -R "$DSYM" "dist/package/"

          ditto -c -k --sequesterRsrc --keepParent \
            "dist/package" \
            "dist/${{ matrix.artifact }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

          gh release upload "$TAG" dist/*.zip --clobber
